<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Çetin Döşeme atölyesinin vitrini" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecdebd"/>
      <stop offset="1" stop-color="#dccaa2"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#dceae6"/>
      <stop offset="0.55" stop-color="#b7cfc9"/>
      <stop offset="1" stop-color="#93b0aa"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#523c28"/>
      <stop offset="1" stop-color="#3d2c1d"/>
    </linearGradient>
    <linearGradient id="skyStripe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Duvar -->
  <rect x="0" y="0" width="900" height="930" fill="url(#wallGrad)"/>

  <!-- Üst pervaz çizgisi -->
  <rect x="0" y="236" width="900" height="8" fill="#b9852f" opacity="0.55"/>

  <!-- Asma tabela -->
  <g>
    <line x1="450" y1="130" x2="450" y2="158" stroke="#8a6a45" stroke-width="3"/>
    <circle cx="450" cy="188" r="36" fill="#b9852f"/>
    <circle cx="450" cy="188" r="36" fill="none" stroke="#7c5c20" stroke-width="2"/>
    <g transform="translate(450,188) scale(0.72)">
      <path d="M-19 -12V-19a7 7 0 0 1 7-7h24a7 7 0 0 1 7 7v7" stroke="#2c2119" stroke-width="4.4" stroke-linecap="round" fill="none"/>
      <path d="M-22 -12h44a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5h-44a5 5 0 0 1-5-5V-7a5 5 0 0 1 5-5Z" stroke="#2c2119" stroke-width="4.4" fill="none"/>
      <path d="M-19 8v10M19 8v10" stroke="#2c2119" stroke-width="4.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tente -->
  <rect x="55" y="252" width="790" height="72" fill="#3f5c4a"/>
  <rect x="118" y="252" width="26" height="72" fill="#eee0c3"/>
  <rect x="220" y="252" width="26" height="72" fill="#eee0c3"/>
  <rect x="322" y="252" width="26" height="72" fill="#eee0c3"/>
  <rect x="424" y="252" width="26" height="72" fill="#eee0c3"/>
  <rect x="526" y="252" width="26" height="72" fill="#eee0c3"/>
  <rect x="628" y="252" width="26" height="72" fill="#eee0c3"/>
  <rect x="730" y="252" width="26" height="72" fill="#eee0c3"/>
  <rect x="55" y="318" width="790" height="7" fill="#93691f"/>

  <!-- Cephe duvarı (pencere/kapı çevresi zemin rengi) -->
  <rect x="60" y="330" width="780" height="600" fill="#e4d5b2"/>

  <!-- Pencere çerçevesi -->
  <rect x="82" y="352" width="470" height="430" rx="8" fill="#3a2a1c"/>
  <rect x="96" y="366" width="442" height="402" rx="4" fill="url(#glassGrad)"/>
  <!-- cam üstü yansıma -->
  <path d="M110 380 L230 380 L150 760 L110 760 Z" fill="url(#skyStripe)"/>
  <!-- pencere bölmeleri -->
  <rect x="96" y="560" width="442" height="6" fill="#3a2a1c" opacity="0.7"/>
  <rect x="314" y="366" width="6" height="402" fill="#3a2a1c" opacity="0.5"/>

  <!-- Camdaki tabela yazısı -->
  <text x="317" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#c99a3f" opacity="0.94" letter-spacing="1">ÇETİN</text>
  <text x="317" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#c99a3f" opacity="0.94" letter-spacing="1">DÖŞEME</text>
  <text x="317" y="556" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#2c4234" opacity="0.85">1982'den beri Kadıköy</text>

  <!-- Sarkıt lamba -->
  <line x1="470" y1="366" x2="470" y2="430" stroke="#2c2119" stroke-width="3"/>
  <circle cx="470" cy="440" r="70" fill="url(#lampGlow)"/>
  <path d="M452 430 L488 430 L480 452 L460 452 Z" fill="#2c2119"/>

  <!-- Kumaş topları -->
  <g>
    <rect x="118" y="600" width="34" height="165" rx="17" fill="#9c4a34"/>
    <rect x="156" y="590" width="34" height="175" rx="17" fill="#3f5c4a"/>
    <rect x="194" y="610" width="34" height="155" rx="17" fill="#b9852f"/>
    <ellipse cx="135" cy="600" rx="17" ry="7" fill="#7a3323"/>
    <ellipse cx="173" cy="590" rx="17" ry="7" fill="#2c4234"/>
    <ellipse cx="211" cy="610" rx="17" ry="7" fill="#93691f"/>
  </g>

  <!-- Koltuk silüeti -->
  <g>
    <rect x="330" y="660" width="150" height="90" rx="16" fill="#7a5a3a"/>
    <rect x="316" y="620" width="34" height="120" rx="14" fill="#6b4d30"/>
    <rect x="466" y="620" width="34" height="120" rx="14" fill="#6b4d30"/>
    <rect x="330" y="600" width="150" height="70" rx="18" fill="#8a6944"/>
    <rect x="340" y="750" width="14" height="26" fill="#4a3626"/>
    <rect x="456" y="750" width="14" height="26" fill="#4a3626"/>
  </g>

  <!-- Kapı -->
  <rect x="590" y="352" width="170" height="540" fill="url(#doorGrad)"/>
  <rect x="608" y="372" width="134" height="190" rx="4" fill="url(#glassGrad)"/>
  <rect x="608" y="580" width="134" height="90" fill="none" stroke="#2c2119" stroke-width="3" opacity="0.5"/>
  <rect x="608" y="686" width="134" height="150" fill="none" stroke="#2c2119" stroke-width="3" opacity="0.5"/>
  <circle cx="730" cy="640" r="8" fill="#d7a856"/>

  <!-- Sağ duvar feneri -->
  <g>
    <rect x="822" y="420" width="6" height="22" fill="#3a2a1c"/>
    <path d="M805 442h46l-8 34h-30Z" fill="#2c2119"/>
    <rect x="812" y="446" width="26" height="24" fill="#f3d98a" opacity="0.8"/>
  </g>

  <!-- Kaldırım -->
  <rect x="0" y="930" width="900" height="170" fill="#c9bc9a"/>
  <rect x="0" y="978" width="900" height="4" fill="#b3a483" opacity="0.6"/>
  <rect x="0" y="1030" width="900" height="4" fill="#b3a483" opacity="0.6"/>

  <!-- Paspas -->
  <rect x="600" y="900" width="150" height="22" rx="6" fill="#93691f" opacity="0.55"/>

  <!-- Saksı bitki -->
  <g>
    <ellipse cx="565" cy="940" rx="46" ry="10" fill="#2a2018" opacity="0.15"/>
    <path d="M540 900h50l-8 42h-34Z" fill="#6b4d30"/>
    <path d="M565 900c-26-10-34-40-20-58 10 20 14 34 20 58Z" fill="#3f5c4a"/>
    <path d="M565 900c22-14 26-44 10-60-6 22-8 38-10 60Z" fill="#4c6b57"/>
    <path d="M565 900c-4-26 4-46 22-56-2 22-8 38-22 56Z" fill="#2c4234"/>
  </g>
</svg>
